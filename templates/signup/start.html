{% extends "signup/_layout.html" %}
{% block title %}이메일 확인 — NETFLIX{% endblock %}

{% block card %}
  <h1 class="card-title">이메일 주소를 확인해 주세요</h1>
  <p class="card-desc">
    아래 주소로 계정 등록 링크를 보내드립니다.<br>
    메일함에서 링크를 눌러 가입을 이어가세요.
  </p>

  <div class="email-readonly">
    <span>{{ email }}</span>
    <a href="{{ url_for('landing') }}">변경</a>
  </div>

  {% if error %}
    <p class="form-error">{{ error }}</p>
  {% endif %}

  <form method="post" action="{{ url_for('signup_send') }}">
    <label class="checkbox">
      <input type="checkbox" name="marketing_opt_in" value="1"
             {% if marketing_opt_in %}checked{% endif %}>
      <span>넷플릭스 특별 혜택 메일을 받겠습니다.</span>
    </label>

    <button type="submit" class="btn-primary">등록 링크 받기</button>
  </form>

  <p class="card-note">링크는 발송 후 15분간만 유효합니다.</p>
{% endblock %}
