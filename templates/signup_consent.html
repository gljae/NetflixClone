<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원가입 | NAFLIX</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: "Noto Sans KR", "Helvetica Neue", Arial, sans-serif;
      color: #fff;
      background: linear-gradient(180deg, #3c1718 0%, #3d0a0a 35%, #100303 70%, #000000 100%);
      background-attachment: fixed;
    }

    .topbar {
      position: relative;
      z-index: 1;
      height: 88px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.13);
    }

    .logo {
      position: absolute;
      top: 22px;
      left: 200px;
      line-height: 1;
      text-decoration: none;
    }

    .logo img {
      display: block;
      height: 56px;
      width: auto;
    }

    .auth-page {
      position: relative;
      z-index: 1;
      min-height: calc(100vh - 88px);
      padding: 44px 20px 90px;
    }

    .auth-panel {
      width: 450px;
      max-width: 100%;
      margin: 0 auto;
      padding: 60px 0 0;
    }

    h1 {
      margin: 0 0 24px;
      color: #fff;
      font-size: 28px;
      font-weight: 500;
      line-height: 1.25;
      word-break: keep-all;
    }

    .flash {
      margin: 0 0 16px;
      padding: 12px 14px;
      border-radius: 4px;
      color: #fff;
      font-size: 14px;
      line-height: 1.45;
      background: rgba(229, 9, 20, 0.92);
    }

    .email-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
      padding: 16px 20px;
      border-radius: 4px;
      background: rgba(51, 51, 51, 0.6);
      font-size: 16px;
    }

    .email-row span {
      overflow-wrap: anywhere;
    }

    .email-row a {
      flex-shrink: 0;
      color: #fff;
      font-size: 14px;
      text-decoration: underline;
    }

    .consent {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 24px;
    }

    .consent input[type="checkbox"] {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      margin-top: 2px;
      accent-color: #737373;
    }

    .consent label {
      font-size: 14px;
      line-height: 1.6;
      color: #fff;
    }

    .consent a {
      color: #fff;
      text-decoration: underline;
    }

    .submit {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 4px;
      color: #fff;
      background: #e50914;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit:hover,
    .submit:focus {
      background: #c40812;
    }

    .support {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 40px;
      color: #fff;
      font-size: 16px;
      text-decoration: none;
    }

    .support::after {
      content: "";
      width: 8px;
      height: 8px;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: translateY(-3px) rotate(45deg);
    }

    a {
      color: inherit;
    }

    a:hover,
    a:focus {
      text-decoration: underline;
    }

    @media (max-width: 760px) {
      .topbar {
        height: 76px;
      }

      .logo {
        top: 20px;
        left: 80px;
      }

      .logo img {
        height: 46px;
      }

      .auth-page {
        min-height: calc(100vh - 76px);
        padding: 22px 0 60px;
        background: #000;
      }

      .auth-panel {
        width: min(100%, 450px);
        padding: 28px 22px 0;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="{{ url_for('login') }}" aria-label="NETFLIX">
      <img src="{{ url_for('static', filename='img/netflix-logo.png') }}" alt="NETFLIX">
    </a>
  </header>

  <main class="auth-page">
    <section class="auth-panel" aria-labelledby="consent-title">
      <h1 id="consent-title">검토 후 계속 진행하세요</h1>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <div class="email-row">
        <span>{{ email }}</span>
        <a href="{{ url_for('login') }}">변경</a>
      </div>

      <form method="post" action="{{ url_for('signup_consent') }}">
        <div class="consent">
          <input type="checkbox" id="agree_privacy" name="agree_privacy" required>
          <label for="agree_privacy">예, 개인정보 처리방침에 따른 개인정보 수집 및 이용에 동의합니다. (상세 정보)</label>
        </div>

        <div class="consent">
          <input type="checkbox" id="marketing_opt_in" name="marketing_opt_in">
          <label for="marketing_opt_in">예, 넷플릭스 특별 프로모션 이메일을 보내주세요. (선택 사항)</label>
        </div>

        <button class="submit" type="submit">다음</button>
      </form>

      <a class="support" href="#">고객 지원</a>
    </section>
  </main>
</body>
</html>
